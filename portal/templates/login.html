{% extends "base.html" %}
{% block titulo %}Entrar — Mural do Campus{% endblock %}
{% block conteudo %}
  <section class="cartao cartao-estreito">
    <h1 class="titulo-pagina">Entrar</h1>
    {% if erro %}
      <p class="erro" role="alert">{{ erro }}</p>
    {% endif %}
    <form method="post" class="formulario">
      <label for="usuario">Usuário</label>
      <input type="text" id="usuario" name="usuario" autocomplete="username" required autofocus>

      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" autocomplete="current-password" required>

      <button type="submit" class="botao">Entrar</button>
    </form>
    <p class="ajuda">
      Contas de demonstração estão no README do laboratório.
    </p>
  </section>
{% endblock %}
