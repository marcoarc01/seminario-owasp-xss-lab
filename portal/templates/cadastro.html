{% extends "base.html" %}
{% block titulo %}Criar conta — Mural do Campus{% endblock %}
{% block conteudo %}
  <section class="cartao cartao-estreito">
    <h1 class="titulo-pagina">Criar conta</h1>
    <p class="nota-discreta">Use apenas dados fictícios neste laboratório local.</p>
    {% if erro %}
      <p class="erro" role="alert">{{ erro }}</p>
    {% endif %}
    <form method="post" class="formulario">
      <label for="usuario">Usuário</label>
      <input type="text" id="usuario" name="usuario" value="{{ dados.get('usuario', '') }}"
             minlength="3" maxlength="32" pattern="[A-Za-z0-9_]+" autocomplete="username" required autofocus>

      <label for="nome">Nome</label>
      <input type="text" id="nome" name="nome" value="{{ dados.get('nome', '') }}"
             minlength="2" maxlength="80" autocomplete="name" required>

      <label for="matricula">Matrícula</label>
      <input type="text" id="matricula" name="matricula" value="{{ dados.get('matricula', '') }}"
             maxlength="30" required>

      <label for="curso">Curso</label>
      <input type="text" id="curso" name="curso" value="{{ dados.get('curso', '') }}"
             minlength="2" maxlength="80" required>

      <label for="recado_privado">Recado privado fictício (opcional)</label>
      <textarea id="recado_privado" name="recado_privado" rows="3" maxlength="500">{{ dados.get('recado_privado', '') }}</textarea>

      <label for="senha">Senha (mínimo de 6 caracteres)</label>
      <input type="password" id="senha" name="senha" minlength="6" maxlength="128"
             autocomplete="new-password" required>

      <label for="confirmar_senha">Confirmar senha</label>
      <input type="password" id="confirmar_senha" name="confirmar_senha" minlength="6"
             maxlength="128" autocomplete="new-password" required>

      <button type="submit" class="botao">Criar conta</button>
    </form>
    <p class="ajuda"><a href="{{ url_for('login') }}">Já tenho conta</a></p>
  </section>
{% endblock %}
